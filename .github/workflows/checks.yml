name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python bridge and credential tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript host and map model tests
        run: node tests/test_model.cjs
      - name: Validate manifest JSON and entry points
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest['schemaVersion'] == 1
          assert manifest['id'] == 'jblparisi.firewall-map'
          for entry in manifest['entryPoints'].values():
              path = Path(entry)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.is_file()
          assert Path('LICENSE').is_file() and Path('preview.png').is_file()
          assert not any(path.is_symlink() for path in Path('.').rglob('*') if '.git' not in path.parts)
          PY
